name: build-and-publish-zeus-host-runner
on:
  workflow_dispatch:
    inputs:
      runner_uid:
        description: "Verified non-privileged host Runner UID"
        required: true
        type: string
      runner_gid:
        description: "Verified non-privileged host Runner GID"
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify locked source snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(sha256sum ARTIFACT-HASHES.sha256 | awk '{print $1}')" = "c60eed10f328fecf24fc233bddd7856e7c7244e045bebb13bd893b91a97c82e9"
          sha256sum -c ARTIFACT-HASHES.sha256
      - name: Validate identity inputs
        shell: bash
        env:
          RUNNER_UID: ${{ inputs.runner_uid }}
          RUNNER_GID: ${{ inputs.runner_gid }}
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_UID" =~ ^[1-9][0-9]{2,4}$ && "$RUNNER_GID" =~ ^[1-9][0-9]{2,4}$ ]]
          test "$RUNNER_UID" -ge 1000
          test "$RUNNER_GID" -ge 1000
          test "$RUNNER_UID" -ne 65534
          test "$RUNNER_GID" -ne 65534
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zeus-host-runner:sha-${{ github.sha }}
          build-args: |
            RUNNER_UID=${{ inputs.runner_uid }}
            RUNNER_GID=${{ inputs.runner_gid }}
      - name: Emit immutable image evidence
        run: |
          set -Eeuo pipefail
          test -n "${{ steps.build.outputs.digest }}"
          printf 'RUN_ID=%s\nIMAGE_ID=UNAVAILABLE_IN_ACTIONS\nREGISTRY_DIGEST=%s\nSOURCE_COMMIT=%s\n' "${{ github.run_id }}" "${{ steps.build.outputs.digest }}" "${{ github.sha }}"
