name: build-and-publish-zeus-host-runner

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact pinned source commit expected for this build"
        required: true
        type: string
      bootstrap_run_id:
        description: "Bootstrap RUN_ID from the host operator"
        required: true
        type: string
      runner_uid:
        description: "Verified non-privileged host Runner UID"
        required: true
        type: string
      runner_gid:
        description: "Verified non-privileged host Runner GID"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/jojje84/zeus-host-runner
  CANDIDATE_LOCKED_SHA256: c60eed10f328fecf24fc233bddd7856e7c7244e045bebb13bd893b91a97c82e9
  PRE_WRAPPER_SOURCE_MANIFEST_SHA256: 7576857c51b5d63a71dd64c6e108f4a65e3660c74dc8c03e0442305792c2140e

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned source and locked build-source export
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_COMMIT"

          test -f SOURCE-PROVENANCE.txt && test ! -L SOURCE-PROVENANCE.txt
          test -f BUILD-SOURCE-HASHES.sha256 && test ! -L BUILD-SOURCE-HASHES.sha256
          test "$(wc -l < SOURCE-PROVENANCE.txt)" -eq 17
          grep -Fx 'FORMAT=zeus-host-runner-source-provenance-v1' SOURCE-PROVENANCE.txt >/dev/null
          grep -Fx 'EXPORT_KIND=derived-build-context' SOURCE-PROVENANCE.txt >/dev/null
          grep -Fx "CANDIDATE_LOCKED_SHA256=${CANDIDATE_LOCKED_SHA256}" SOURCE-PROVENANCE.txt >/dev/null
          grep -Fx "PRE_WRAPPER_SOURCE_MANIFEST_SHA256=${PRE_WRAPPER_SOURCE_MANIFEST_SHA256}" SOURCE-PROVENANCE.txt >/dev/null
          grep -Fx 'BUILD_CONTEXT_FILE_COUNT=11' SOURCE-PROVENANCE.txt >/dev/null

          test "$(grep -c '^BUILD_SOURCE_MANIFEST_SHA256=' SOURCE-PROVENANCE.txt)" -eq 1
          provenance_manifest_sha=$(sed -n 's/^BUILD_SOURCE_MANIFEST_SHA256=//p' SOURCE-PROVENANCE.txt)
          [[ "$provenance_manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          actual_manifest_sha=$(sha256sum BUILD-SOURCE-HASHES.sha256 | awk '{print $1}')
          test "$actual_manifest_sha" = "$provenance_manifest_sha"

          required=(
            Dockerfile
            runner.js
            runner-schema.json
            operations.allowlist.json
            adapter.js
            fake-backend.js
            lease.js
            work-queue-bridge.js
            daemon.js
            healthcheck.js
            readiness.js
          )

          test "$(wc -l < BUILD-SOURCE-HASHES.sha256)" -eq "${#required[@]}"
          awk 'NF != 2 || $1 !~ /^[0-9a-f]{64}$/ || $2 !~ /^[A-Za-z0-9._-]+$/ { exit 1 }' BUILD-SOURCE-HASHES.sha256

          expected=$(mktemp)
          actual=$(mktemp)
          trap 'rm -f "$expected" "$actual"' EXIT
          printf '%s\n' "${required[@]}" | LC_ALL=C sort >"$expected"
          awk '{print $2}' BUILD-SOURCE-HASHES.sha256 | LC_ALL=C sort >"$actual"
          diff -u "$expected" "$actual"

          i=0
          for f in "${required[@]}"; do
            i=$((i+1))
            key=$(printf 'BUILD_CONTEXT_FILE_%02d' "$i")
            grep -Fx "${key}=${f}" SOURCE-PROVENANCE.txt >/dev/null
            test -f "$f" && test ! -L "$f"
          done
          test "$(grep -c '^BUILD_CONTEXT_FILE_[0-9][0-9]=' SOURCE-PROVENANCE.txt)" -eq "${#required[@]}"

          sha256sum -c BUILD-SOURCE-HASHES.sha256

          rm -rf .ci-build-context
          mkdir -m 700 .ci-build-context
          for f in "${required[@]}"; do
            cp -- "$f" ".ci-build-context/$f"
            test -f ".ci-build-context/$f" && test ! -L ".ci-build-context/$f"
          done
          (
            cd .ci-build-context
            sha256sum -c ../BUILD-SOURCE-HASHES.sha256
          )

      - name: Validate identity and bootstrap inputs
        shell: bash
        env:
          BOOTSTRAP_RUN_ID: ${{ inputs.bootstrap_run_id }}
          RUNNER_UID: ${{ inputs.runner_uid }}
          RUNNER_GID: ${{ inputs.runner_gid }}
        run: |
          set -Eeuo pipefail
          [[ "$BOOTSTRAP_RUN_ID" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+$ ]]
          [[ "$RUNNER_UID" =~ ^[1-9][0-9]{2,4}$ && "$RUNNER_GID" =~ ^[1-9][0-9]{2,4}$ ]]
          test "$RUNNER_UID" -ge 1000
          test "$RUNNER_GID" -ge 1000
          test "$RUNNER_UID" -ne 65534
          test "$RUNNER_GID" -ne 65534

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .ci-build-context
          file: .ci-build-context/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            RUNNER_UID=${{ inputs.runner_uid }}
            RUNNER_GID=${{ inputs.runner_gid }}

      - name: Emit immutable image evidence
        env:
          BOOTSTRAP_RUN_ID: ${{ inputs.bootstrap_run_id }}
          RUNNER_UID: ${{ inputs.runner_uid }}
          RUNNER_GID: ${{ inputs.runner_gid }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          REGISTRY_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REGISTRY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REGISTRY_IMAGE" == "ghcr.io/jojje84/zeus-host-runner" ]]
          BUILD_SOURCE_MANIFEST_SHA256=$(sha256sum BUILD-SOURCE-HASHES.sha256 | awk '{print $1}')
          printf 'BOOTSTRAP_RUN_ID=%s\nGITHUB_RUN_ID=%s\nIMAGE_ID=%s\nREGISTRY_IMAGE=%s\nREGISTRY_DIGEST=%s\nSOURCE_COMMIT=%s\nCANDIDATE_LOCKED_SHA256=%s\nPRE_WRAPPER_SOURCE_MANIFEST_SHA256=%s\nBUILD_SOURCE_MANIFEST_SHA256=%s\nRUNNER_UID=%s\nRUNNER_GID=%s\n' "$BOOTSTRAP_RUN_ID" "$GITHUB_RUN_ID" "$IMAGE_ID" "$REGISTRY_IMAGE" "$REGISTRY_DIGEST" "$SOURCE_COMMIT" "$CANDIDATE_LOCKED_SHA256" "$PRE_WRAPPER_SOURCE_MANIFEST_SHA256" "$BUILD_SOURCE_MANIFEST_SHA256" "$RUNNER_UID" "$RUNNER_GID"
