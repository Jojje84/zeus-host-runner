services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNNER_UID: ${RUNNER_UID:?bootstrap-allocated UID required}
        RUNNER_GID: ${RUNNER_GID:?bootstrap-allocated GID required}
    user: "${RUNNER_UID:?bootstrap-allocated UID required}:${RUNNER_GID:?bootstrap-allocated GID required}"
    read_only: true
    privileged: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    networks: [runner_internal]
    ports: []
networks:
  runner_internal:
    internal: true
